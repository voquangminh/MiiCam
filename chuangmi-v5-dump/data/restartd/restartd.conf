# Restartd configuration file

# Format:
#
# <process_name> <regexp> <action_if_not_running> <action_if_running>
#
# process_name: the name of the process which is just for logging
# as it does not affect for the regexp
#
# regexp: the POSIX regular expression for the command line of the
# process
#
# action_if_not_running: a script or program name to execute if the
# regexp does not match the full process command line
#
# action_if_running: a script or program name to execute if the regexp
# matches the full process command line

# Example:
#
# restartd ".*restartd" "/bin/echo 'It is not running!' >/tmp/restartd.out" "/bin/echo 'It is running!' >/tmp/restartd.out"
#mosquitto "/usr/sbin/mosquitto" "/usr/sbin/mosquitto -c /etc/mosquitto/mosquitto.conf" "/bin/echo 'mosquitto is running'"
miio_client "/mnt/data/ot_wifi_tool/miio_client -D" "/mnt/data/ot_wifi_tool/miio_client -D" "/bin/echo 'miio_client is running'"
miio_client_helper "/mnt/data/ot_wifi_tool/miio_client_helper" "/mnt/data/ot_wifi_tool/miio_client_helper_nomqtt.sh | /usr/bin/logger -t miio_client_helper &" "/bin/echo 'miio_client is running'"
miio_ota "/mnt/data/miio_ota/miio_ota.*" "/mnt/data/miio_ota/miio_ota -p /mnt/data/miio_ota/pre-ota.sh -P /mnt/data/miio_ota/post-ota.sh | /usr/bin/logger -t miio_ota &" "/bin/echo 'miio_ota is running'"
miot_devicekit "/mnt/data/miot/miot_devicekit" "/mnt/data/imi/imi_init/S93miot_devicekit restart" "/bin/echo 'miot_devicekit is running'"
miio_avstreamer "/mnt/data/miio_av/miio_avstreamer" "/mnt/data/imi/imi_init/S60miio_avstreamer restart" "/bin/echo 'miio_avstreamer is running'"
#miio_bt "/mnt/data/miio_ble/miio_bt" "/etc/init.d/S94miio_bt restart" "/bin/echo 'miio_bt is running'"
miio_smb "/mnt/data/miio_smb/miio_smb" "/mnt/data/imi/imi_init/S95miio_smb restart" "/bin/echo 'miio_smb is running'"
ntpd "ntpd" "/tmp/firmware/bin/service ntp start" "echo 'ntpd is running'"
mqtt "/tmp/firmware/bin/mqtt" "/tmp/firmware/bin/service mqtt start" "echo 'mqtt is running'"
rtspd "rtspd" "/tmp/firmware/bin/service rtsp start" "echo 'rtspd is running'"
telnetd "/usr/sbin/telnetd" "/mnt/data/imi/imi_init/_S50telnet start" "echo 'telnetd is running'"
