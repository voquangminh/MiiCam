[global]
	workgroup = WORKGROUP
	server string = MiiCam
	security = share
	map to guest = Bad User
	guest account = root
	hosts allow = 192.168.1.
	log file = /tmp/sd/firmware/samba/var/log.%m
	max log size = 50
	lock directory = /tmp/sd/firmware/samba/var
	state directory = /tmp/sd/firmware/samba/var
	private dir = /tmp/sd/firmware/samba/var/private
	pid directory = /tmp/sd/firmware/samba/var
	socket options = TCP_NODELAY IPTOS_LOWDELAY SO_RCVBUF=65536 SO_SNDBUF=65536

[sdcard]
	path = /tmp/sd
	read only = no
	guest ok = yes
	browseable = yes
	create mask = 0666
	directory mask = 0777