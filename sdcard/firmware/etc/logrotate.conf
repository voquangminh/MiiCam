daily
su root root
rotate 2
create 0644 root root
compress
missingok

## Logs live in /var/log (tmpfs); the nightly crontab job uses
## scripts/logrotate.sh which flushes+gzips them to /tmp/sd/log/archive.
## This conf only applies if a real logrotate binary is deployed.
/var/log/ft_boot.log /var/log/syslog {
    missingok
}

/var/log/lighttpd.log /var/log/webapp.log /var/log/php_errors.log /var/log/mqtt.log {
    missingok
}

/var/log/rtspd.log {
    missingok
}