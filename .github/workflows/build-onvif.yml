name: Build MiiCam ONVIF

on:
  workflow_dispatch:

jobs:
  build-onvif:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Extract SDK
        run: |
          cd "${{ github.workspace }}/sdk"

          tar -xzf toolchain_gnueabi-4.4.0_ARMv5TE.tgz
          tar -xzf gm_lib_2015-01-09-IPCAM.tgz

      - name: Install 32-bit compatibility libraries
        run: |
          sudo dpkg --add-architecture i386

          sudo apt-get update || true

          sudo apt-get install -y \
              libc6:i386 \
              libstdc++6:i386 \
              lib32z1 \
              libmpfr6:i386 \
              libgmp10:i386

          sudo ln -sf \
              /usr/lib/i386-linux-gnu/libmpfr.so.6 \
              /usr/lib/i386-linux-gnu/libmpfr.so.4

          sudo ln -sf \
              /usr/lib/i386-linux-gnu/libgmp.so.10 \
              /usr/lib/i386-linux-gnu/libgmp.so.3

      - name: Locate Toolchain
        run: |
          REAL_BIN_DIR=$(dirname $(
            find "${{ github.workspace }}/sdk" \
              -name "arm-unknown-linux-uclibcgnueabi-gcc" \
              | head -n 1
          ))

          echo "REAL_BIN_DIR=$REAL_BIN_DIR" >> $GITHUB_ENV

          REAL_SDK_ROOT=$(dirname $(dirname "$REAL_BIN_DIR"))
          chmod -R +x "$REAL_SDK_ROOT"

      - name: Build ONVIF Server
        run: |
          export PATH="${REAL_BIN_DIR}:$PATH"

          make build/onvif_server

      - name: Verify Binary
        run: |
          file tools/bin/onvif_server || true
          ls -lah tools/bin/onvif_server

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: onvif_server
          path: tools/bin/onvif_server

      - name: Commit Binary
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f tools/bin/onvif_server

          git commit -m "Automated build: update onvif_server" || \
            echo "No changes to commit"

          git pull origin HEAD --no-rebase || true

          git push origin HEAD
